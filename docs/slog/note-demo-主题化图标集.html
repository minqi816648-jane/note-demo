<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>note-demo · 主题化图标集（水墨 / 极光）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
:root{
  --pbg:#F6F1E6; --card:#FFFDF7; --pfg:#1C1B18; --acc:#B83A2A; --mut:#8A8272;
  --line:#E5DCC8; --gold:#E8C56A; --ink:#1C1B18; --thumb-bg:#ECE6D8;
  --stroke:#1C1B18; --accent-stroke:#B83A2A; --muted:#A19A87;
  --code-bg:#EFE9DB; --chip:#F0EBDD;
}
[data-theme="night"]{
  --pbg:#0A0D1F; --card:rgba(255,255,255,.06); --pfg:#F2F4FF; --mut:#7F89B4;
  --line:rgba(255,255,255,.14); --gold:#D9B76A; --thumb-bg:rgba(255,255,255,.03);
  --stroke:#F2F4FF; --accent-stroke:#8FE7F5; --muted:#5D6890;
  --code-bg:rgba(255,255,255,.05); --chip:rgba(255,255,255,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',system-ui,sans-serif;background:var(--pbg);color:var(--pfg);
  -webkit-font-smoothing:antialiased;transition:.4s;min-height:100vh;padding:38px 28px 70px}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;
  opacity:0;transition:.6s;z-index:0}
body::before{width:420px;height:420px;left:-130px;top:-90px;background:#4FD8EB}
body::after{width:400px;height:400px;right:-110px;bottom:-70px;background:#8B7CFF}
[data-theme="night"] body::before,[data-theme="night"] body::after{opacity:.15}

.wrap{max-width:1080px;margin:0 auto;position:relative;z-index:1}

/* 页头 */
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:10px}
h1{font-family:'Noto Serif SC',serif;font-weight:900;font-size:26px;letter-spacing:.04em}
h1 .seal{display:inline-flex;width:30px;height:30px;background:#B83A2A;border-radius:8px;color:#fff;
  font-family:'Ma Shan Zheng';font-size:17px;align-items:center;justify-content:center;transform:rotate(-4deg);
  box-shadow:2px 2px 0 rgba(184,58,42,.22);margin-right:10px;vertical-align:-6px}
.top .sub{font-size:11px;color:var(--mut);letter-spacing:.08em;margin-top:6px}
.theme-switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;font-size:11.5px;font-weight:600;color:var(--mut)}
.theme-switch label{cursor:pointer;padding:6px 16px;border-radius:99px;transition:.25s}
.theme-switch input{display:none}
.theme-switch input:checked+label{background:var(--pfg);color:var(--pbg)}

/* 规范框 */
.spec{margin:18px 0 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px;font-size:12px;line-height:1.9;color:var(--pfg)}
.spec b{color:var(--acc)}[data-theme="night"] .spec b{color:#8FE7F5}
.spec .row{display:flex;flex-wrap:wrap;gap:10px 26px}
.spec .row i{font-style:normal}
.spec .kv{font-size:11px;color:var(--mut);background:var(--chip);border-radius:8px;padding:2px 9px;display:inline-block;margin:2px 4px 0 0}
.spec .t{font-family:'Noto Serif SC';font-weight:900;font-size:13px;margin-bottom:8px;letter-spacing:.05em}

/* 分类 */
.cat{margin-top:30px}
.cat-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cat-h .no{font-family:'Fraunces','Noto Serif SC';font-size:13px;font-weight:700;color:var(--acc);width:26px;height:26px;
  border:1.5px solid var(--acc);border-radius:8px;display:grid;place-items:center}
[data-theme="night"] .cat-h .no{color:#8FE7F5;border-color:#8FE7F5}
.cat-h h2{font-family:'Noto Serif SC';font-size:17px;font-weight:900;letter-spacing:.05em}
.cat-h .desc{font-size:10.5px;color:var(--mut);margin-left:auto;letter-spacing:.03em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px 12px;
  display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;transition:.22s;position:relative}
.item:hover{transform:translateY(-3px);box-shadow:0 8px 20px -12px rgba(28,27,24,.3);border-color:var(--acc)}
[data-theme="night"] .item:hover{border-color:rgba(143,231,245,.4)}
.item .ic{width:44px;height:44px;border-radius:11px;background:var(--thumb-bg);display:grid;place-items:center;transition:.2s}
.item:hover .ic{background:rgba(184,58,42,.08)}[data-theme="night"] .item:hover .ic{background:rgba(143,231,245,.10)}
.item .i{width:24px;height:24px}
.item .nm{font-size:11px;font-weight:600;color:var(--pfg)}
.item .id{font-size:8.5px;color:var(--muted);font-family:monospace;letter-spacing:.02em}
.item .tag{position:absolute;top:8px;right:8px;font-size:7.5px;color:var(--acc);border:1px solid var(--acc);
  border-radius:5px;padding:0 5px;line-height:1.6;opacity:0;transition:.2s}
[data-theme="night"] .item .tag{color:#8FE7F5;border-color:#8FE7F5}
.item:hover .tag{opacity:1}
.item .tag.ess{opacity:1}

/* 弹层 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);z-index:50;
  display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--pbg);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:560px;width:100%;
  max-height:84vh;overflow:auto;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.modal .m-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.modal .big-icon{width:64px;height:64px;background:var(--thumb-bg);border-radius:16px;display:grid;place-items:center;flex-shrink:0}
.modal .big-icon .i{width:34px;height:34px}
.modal .m-t h4{font-family:'Noto Serif SC';font-size:18px;font-weight:900}
.modal .m-t .id{font-family:monospace;font-size:11px;color:var(--acc);margin-top:3px}[data-theme="night"] .modal .m-t .id{color:#8FE7F5}
.modal .m-t .use{font-size:10.5px;color:var(--mut);margin-top:4px}
.modal .code{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  font-family:monospace;font-size:11px;line-height:1.7;white-space:pre-wrap;word-break:break-all;margin:14px 0}
.modal .act{display:flex;gap:10px;justify-content:flex-end}
.btn{font-size:12px;font-weight:600;border-radius:99px;padding:8px 18px;cursor:pointer;border:1px solid var(--line);
  background:var(--card);color:var(--pfg);transition:.2s}
.btn.copy{background:var(--pfg);color:var(--pbg);border-color:var(--pfg)}
[data-theme="night"] .btn.copy{background:linear-gradient(120deg,#4FD8EB,#8B7CFF 55%,#FF7AD9);border-color:transparent}
.btn:hover{transform:translateY(-1px)}
.tip{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--pfg);color:var(--pbg);
  padding:9px 20px;border-radius:99px;font-size:12px;z-index:60;opacity:0;transition:.3s;pointer-events:none}
.tip.show{opacity:1}

.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block}
</style>
</head>

});

var CATS=[
  {k:'nav',  t:'一级 · 底部导航',  d:'BOTTOM NAV · 全局骨架'},
  {k:'tool', t:'二级 · 内容操作',  d:'HEADER + ACTION'},
  {k:'view', t:'二级 · 视图切换',  d:'LIST / CAL / GALLERY'},
  {k:'cat',  t:'三级 · 分类与标签',d:'CATEGORY · TAG'},
  {k:'media',t:'三级 · 多媒体',    d:'MEDIA INSERT'},
  {k:'edit', t:'三级 · 编辑状态',  d:'EDITOR STATE'},
  {k:'set',  t:'四级 · 设置页',    d:'SETTINGS PANEL'},
];

var counts={};
ICONS.forEach(function(x){counts[x.c]=(counts[x.c]||0)+1});

// 构建分类 → 展示
var app=document.getElementById('app');
var order={};
CATS.forEach(function(c){order[c.k]=c});
var sorted=[];
ICONS.forEach(function(x){if(!sorted[x.c])sorted[x.c]=[];sorted[x.c].push(x)});

CATS.forEach(function(cat){
  var items=sorted[cat.k]||[];
  if(!items.length)return;
  var sec=document.createElement('section');
  sec.className='cat';
  sec.innerHTML='<div class="cat-h"><span class="no">'+(cat.t.slice(0,1))+'</span><h2>'+cat.t+'</h2>'+
    '<span class="desc">'+cat.d+' · '+items.length+' 枚</span></div>'+
    '<div class="grid"></div>';
  var grid=sec.querySelector('.grid');
  items.forEach(function(it){
    var tag=it.ess?'<span class="tag ess">核心</span>':'<span class="tag">复用</span>';
    var el=document.createElement('div');
    el.className='item';
    el.innerHTML='<div class="ic"><svg class="i"><use href="#'+it.i+'"/></svg></div>'+
      '<div class="nm">'+it.n+'</div><div class="id">'+it.i+'</div>'+tag;
    el.addEventListener('click',function(){openModal(it)});
    grid.appendChild(el);
  });
  app.appendChild(sec);
});

/* 弹层：展示大图标 + SVG 定义 + 复制 */
var ovl=document.getElementById('ovl');
var svgCodeCache={};
function openModal(it){
  var s=document.getElementById(it.i);
  var inner=s?s.innerHTML.replace(/\/>/g,' />'):'';
  var code='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">\n  '+inner+'\n</svg>';
  ovl.innerHTML='<div class="modal">'+
    '<div class="m-head"><div class="big-icon"><svg class="i"><use href="#'+it.i+'"/></svg></div>'+
    '<div class="m-t"><h4>'+it.n+'</h4><div class="id">'+it.i+'</div><div class="use">'+it.u+'</div></div></div>'+
    '<div style="font-size:10.5px;color:var(--mut);margin-bottom:4px">SVG 定义（可直接复制）</div>'+
    '<div class="code" id="codeBox">'+code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>'+
    '<div class="act"><button class="btn" onclick="closeModal()">关闭</button>'+
    '<button class="btn copy" onclick="copyCode()">复制 SVG</button></div></div>';
  ovl.classList.add('show');
  ovl.__code=code;
}
function closeModal(){ovl.classList.remove('show')}
function copyCode(){
  navigator.clipboard.writeText(ovl.__code).then(function(){tip()});
}
function tip(){var t=document.getElementById('tip');t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1600)}
ovl.addEventListener('click',function(e){if(e.target===ovl)closeModal()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
</script>
